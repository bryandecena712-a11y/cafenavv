<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>CafeNav | Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            box-sizing: border-box;
            background: #09090b;
            color: #fafafa;
            font-family: sans-serif;
            text-align: center;
        }
        
        main {
            max-width: 28rem;
        }
        
        h1 {
            color: #f59e0b;
        }
        
        p {
            color: #a1a1aa;
            line-height: 1.6;
        }
        
        button {
            border: 0;
            border-radius: 999px;
            background: #f59e0b;
            color: #09090b;
            padding: .85rem 1.4rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main>
        <h1>CafeNav is offline</h1>
        <p>Reconnect to discover fresh cafe data. Pages you already visited remain available from your cache.</p><button onclick="location.reload()">Try again</button></main>
</body>

</html>
