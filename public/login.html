<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeNav - Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HERO SECTION WITH SAME BACKGROUND AS HOME PAGE -->
    <header class="hero-section">
        <nav class="navbar">
            <div class="logo">
                <span class="fa-stack logo-stack">
        <i class="fa-solid fa-location-dot fa-stack-2x logo-pin"></i>
    </span>
                <span class="logo-text">CafeNav</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="#">Offers</a></li>
                <li><a href="#">Locate</a></li>
                <li><a href="#">Add Cafe</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </nav>

        <!-- CENTERED LOGIN FORM -->
        <div class="login-wrapper">
            <h1 class="login-header">LOGIN</h1>
            <p class="login-subtext">Login with your email and password.</p>

            <!-- RED ERROR BANNER -->
            <div id="errorMessage"></div>
            <div id="errorMessage" class="error-alert hidden">
                It's look like you're not a member!<br> Please click on the bottom link to sign up
            </div>

            <form id="loginForm" class="login-form-box">
                <!-- Email Input -->
                <div class="input-field-container">
                    <i class="fa-solid fa-envelope field-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <!-- Password Input -->
                <div class="input-field-container">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="options-row">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="forgot-password.html" class="forgot-password-link">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn-dark-login">Login</button>

                <!-- Sign up text -->
                <p class="signup-prompt">
                    Don’t have an Account? <a href="signup.html" class="blue-signup">Sign up now</a>
                </p>
            </form>
        </div>
    </header>

    <script src="app.js"></script>
</body>

</html>
