<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeNav - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="hero-section">
        <nav class="navbar">
            <div class="logo">
                <span class="fa-stack logo-stack">
                    <i class="fa-solid fa-location-dot fa-stack-2x logo-pin"></i>
                </span>
                <span class="logo-text">CafeNav</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="#">Offers</a></li>
                <li><a href="#">Locate</a></li>
                <li><a href="#">Add Cafe</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </nav>

        <div class="login-wrapper">
            <!-- DYNAMIC CONTAINER FOR ALL STEPS -->
            <div id="forgotPasswordBox">

                <!-- STEP 1: Request Email -->
                <h1 class="forgot-header">Forgot Password</h1>
                <p class="forgot-subtext">Please enter your email address.</p>

                <div id="forgotError" class="alert-box alert-danger hidden">
                    This email address does not exist!
                </div>

                <form id="forgotForm" class="forgot-form-box">
                    <div class="input-field-container">
                        <input type="email" id="forgotEmail" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="btn-dark-forgot">SEND</button>
                </form>

            </div>
        </div>
    </header>

    <script src="app.js"></script>
</body>

</html>
