<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeNav - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="hero-section">
        <nav class="navbar">
            <div class="logo">
                <span class="fa-stack logo-stack">
                    <i class="fa-solid fa-location-dot fa-stack-2x logo-pin"></i>
                </span>
                <span class="logo-text">CafeNav</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="#">Offers</a></li>
                <li><a href="#">Locate</a></li>
                <li><a href="#">Add Cafe</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </nav>

        <div class="login-wrapper">
            <div id="signupBox">
                <h1 class="login-header">Sign Up</h1>
                <p class="login-subtext">It's quick and easy.</p>

                <!-- NO action or method attribute here, JS will handle it -->
                <form id="signupForm" class="login-form-box">
                    <div class="input-field-container">
                        <input type="text" id="signupUsername" placeholder="Username" required>
                    </div>

                    <div class="input-field-container">
                        <input type="email" id="signupEmail" placeholder="Email address" required>
                    </div>

                    <div class="input-field-container">
                        <input type="password" id="signupPassword" placeholder="Password" required>
                    </div>

                    <div class="input-field-container">
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm password" required>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-dark-login">Sign Up</button>

                    <div class="divider-container">
                        <span class="divider-line"></span>
                        <a href="login.html" class="back-login-link">Back to Login</a>
                        <span class="divider-line"></span>
                    </div>
                </form>
            </div>
        </div>
    </header>

    <!-- CRITICAL: Make sure script is inside body at the bottom -->
    <script src="app.js"></script>
</body>

</html>
